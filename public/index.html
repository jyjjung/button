<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Number Game</title>
  </head>
  <body>
    <div id="root"></div>
    <p class="rule">
      <div class="rule">
        YOU CANNOT GO BELOW 0 OR ABOVE 100.
      </div> 
      <div class="rule">
        YOU CANNOT USE MORE THAN 100 FUNCTIONS.
      </div>
      <div class="rule">
        NOTE: LEFT - MINUS, RIGHT - PLUS, UP - RANDOM, DOWN - RESET COUNT, SPACE OR R - RESET GAME.
      </div>  
    </p>
  </body>
</html>
